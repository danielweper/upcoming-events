name: Update events

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay this by several minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-events.mjs
        env:
          ICS_URL: ${{ vars.ICS_URL }}   # optional; defaults to the fklub.dk feed
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html stregsystem.css events.css app.js config.js logo.svg events.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
